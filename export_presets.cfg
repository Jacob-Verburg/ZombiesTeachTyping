[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gut/*, tests/*, tools/*, docs/*, _bmad/*, _bmad-output/*, build/*, .gutconfig.json"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<style>
:root { --zts-unit: min(calc(100vw / 640), calc(100vh / 360)); }
body, #status { background-color: #2B1D3F; }
#status-splash { image-rendering: pixelated; width: calc(292 * var(--zts-unit)); max-width: 90%; height: auto; }
#status-progress { appearance: none; -webkit-appearance: none; height: calc(12 * var(--zts-unit)); width: 40%; border: calc(1 * var(--zts-unit)) solid #1E1428; background-color: #4A3366; border-radius: 0; }
#status-progress::-webkit-progress-bar { background-color: #4A3366; }
#status-progress::-webkit-progress-value { background-color: #F07A1C; }
#status-progress::-moz-progress-bar { background-color: #F07A1C; }
#status-progress:indeterminate { background-image: repeating-linear-gradient(90deg, #F07A1C 0 16px, #4A3366 16px 32px); }
#status-progress:indeterminate::-moz-progress-bar { background-color: transparent; }
#status-notice { background-color: #F6E7C1; color: #1E1428; border: 2px solid #1E1428; border-radius: 0; }
#status-notice { font-size: 0; line-height: 0; }
#status-notice::after { content: 'This game needs a newer browser. Try Chrome, Edge or Firefox on a computer.'; display: block; font-size: max(16px, calc(16 * var(--zts-unit))); line-height: 1.5; }
</style>"
progressive_web_app/enabled=false

